<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Berita Terkini - Portal KOARMADA RI</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen flex flex-col justify-between font-sans">

  <header class="bg border-b border-blue-900/60" style="background-color: #0b132b;">
    <div class="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="bg-blue-900/80 border border-blue-700/60 w-11 h-11 rounded-xl flex items-center justify-center text-2xl shadow-lg">
          ⚓
        </div>
        <div>
          <h1 class="text-white font-black text-xl tracking-wider leading-none uppercase">PORTAL KOARMADA RI</h1>
          <p class="text-blue-400 text-[10px] font-bold tracking-widest mt-1 uppercase">Komando Armada Republik Indonesia</p>
        </div>
      </div>
    </div>

    <nav class="bg border-t border-blue-900/40" style="background-color: #1c2541;">
      <div class="max-w-6xl mx-auto px-4">
        <div class="flex items-center gap-2 text-xs font-bold uppercase tracking-wider overflow-x-auto py-2.5">
          <a href="index.html" class="px-4 py-2 rounded-lg text-gray-300 hover:text-white hover:bg-blue-900/50 transition whitespace-nowrap">Beranda</a>
          <a href="index.html#profil" class="px-4 py-2 rounded-lg text-gray-300 hover:text-white hover:bg-blue-900/50 transition whitespace-nowrap">Profil</a>
          <a href="berita.html" class="px-4 py-2 rounded-lg text-white bg-blue-700 border border-blue-500/50 shadow transition whitespace-nowrap">Berita</a>
          <a href="index.html#pengumuman" class="px-4 py-2 rounded-lg text-gray-300 hover:text-white hover:bg-blue-900/50 transition whitespace-nowrap">Pengumuman</a>
          <a href="index.html#galeri" class="px-4 py-2 rounded-lg text-gray-300 hover:text-white hover:bg-blue-900/50 transition whitespace-nowrap">Galeri</a>
          <a href="index.html#rekrutmen" class="px-4 py-2 rounded-lg text-gray-300 hover:text-white hover:bg-blue-900/50 transition whitespace-nowrap">Rekrutmen</a>
        </div>
      </div>
    </nav>
  </header>

  <main class="max-w-6xl mx-auto px-4 py-8 flex-grow w-full">
    
    <div class="flex justify-between items-center mb-6 border-b border-gray-800 pb-3">
      <h2 class="text-lg font-bold border-b-2 border-blue-600 pb-3 -mb-3 text-white uppercase tracking-wider">
        Berita Terkini
      </h2>
    </div>

    <div id="gridBeritaPublik" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      <div class="col-span-full text-center py-12 text-gray-500 italic text-sm">
        Memuat berita terbaru...
      </div>
    </div>

  </main>

  <footer class="bg-gray-900 border-t border-gray-800 py-6 text-xs text-gray-500 mt-12">
    <div class="max-w-6xl mx-auto px-4 flex flex-col md:flex-row items-center justify-between gap-4">
      <div class="flex items-center gap-2">
        <span>⚓</span>
        <span class="text-gray-300 font-bold uppercase">Komando Armada RI</span>
      </div>
      <p>&copy; 2026 Portal KOARMADA RI. All Rights Reserved.</p>
    </div>
  </footer>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
    import { 
      getFirestore, 
      collection, 
      getDocs, 
      query, 
      orderBy 
    } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

    // Konfigurasi Firebase Resmi Portal KOARMADA
    const firebaseConfig = {
      apiKey: "AIzaSyAMYa0AF2_aH8N93fR22YIa9Kg0AGjKrLI",
      authDomain: "portal-koarmada-92e19.firebaseapp.com",
      projectId: "portal-koarmada-92e19",
      storageBucket: "portal-koarmada-92e19.firebasestorage.app",
      messagingSenderId: "966060677941",
      appId: "1:966060677941:web:cd6074b5d8e2b3b9edca7c"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    async function loadBeritaPublik() {
      const container = document.getElementById('gridBeritaPublik');
      if (!container) return;

      try {
        const q = query(collection(db, "berita"), orderBy("waktu", "desc"));
        const querySnapshot = await getDocs(q);

        if (querySnapshot.empty) {
          container.innerHTML = `
            <div class="col-span-full text-center py-16 bg-gray-900/50 border border-gray-800 rounded-2xl">
              <p class="text-gray-400 font-medium text-sm">Belum ada berita yang dipublikasikan.</p>
              <p class="text-gray-600 text-xs mt-1">Tambahkan postingan dari halaman admin berita.</p>
            </div>
          `;
          return;
        }

        let html = "";
        querySnapshot.forEach((docSnap) => {
          const data = docSnap.data();

          // Deteksi otomatis format video (.mp4) atau gambar biasa
          let mediaHtml = "";
          const isVideo = data.mediaUrl && (data.mediaUrl.endsWith(".mp4") || data.mediaUrl.includes("video"));

          if (isVideo) {
            mediaHtml = `
              <div class="relative bg-black h-48 flex items-center justify-center overflow-hidden">
                <video src="${data.mediaUrl}" controls class="w-full h-full object-cover"></video>
              </div>
            `;
          } else {
            mediaHtml = `
              <div class="h-48 overflow-hidden bg-gray-800">
                <img src="${data.mediaUrl}" alt="${data.judul}" class="w-full h-full object-cover hover:scale-105 transition duration-500" onerror="this.src='https://via.placeholder.com/600x400/1e293b/ffffff?text=KOARMADA+RI'">
              </div>
            `;
          }

          // Format Tampilan Kartu Berita Sesuai Gambar
          html += `
            <article class="bg-gray-900 border border-gray-800 rounded-xl overflow-hidden shadow-xl flex flex-col justify-between hover:border-blue-500/50 transition duration-300">
              <div>
                ${mediaHtml}
                <div class="p-5">
                  <span class="text-[11px] font-bold text-yellow-500 uppercase tracking-wider block mb-1">
                    ${data.tanggal || 'TERKINI'}
                  </span>
                  <h3 class="text-white font-bold text-sm mb-2 leading-snug uppercase tracking-tight line-clamp-2">
                    ${data.judul}
                  </h3>
                  <p class="text-gray-400 text-xs leading-relaxed whitespace-pre-line line-clamp-4">
                    ${data.deskripsi}
                  </p>
                </div>
              </div>
            </article>
          `;
        });

        container.innerHTML = html;
      } catch (err) {
        console.error("Gagal memuat berita:", err);
        container.innerHTML = `
          <div class="col-span-full text-center py-12 text-red-400 text-xs font-medium">
            Gagal memuat berita dari server Firebase.
          </div>
        `;
      }
    }

    loadBeritaPublik();
  </script>
</body>
</html>
