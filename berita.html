<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Admin - Koarmada RI</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">

  <style>
    body { font-family: 'Inter', sans-serif; }
    .font-resmi { font-family: 'Playfair Display', serif; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased flex flex-col min-h-screen">

  <div class="bg-slate-900 text-white">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex flex-col md:flex-row items-center justify-between gap-4">
      <div class="flex items-center gap-4">
        <div class="w-14 h-14 bg-white rounded-full p-1 shadow-lg">
          <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/7/75/Koarmada_RI.svg/250px-Koarmada_RI.svg.png?utm_source=id.wikipedia.org&utm_campaign=parser&utm_content=thumbnail" alt="Logo" class="w-full h-full object-contain">
        </div>
        <div>
          <h1 class="text-xl md:text-2xl font-bold tracking-wide uppercase">Komando Armada Republik Indonesia</h1>
          <p class="text-red-600 text-xs md:text-sm font-semibold tracking-widest uppercase">"Ekapada Banda Jala Nusa"</p>
        </div>
      </div>
      <div id="btnKeluarWrapper" class="hidden">
        <button onclick="logoutAdmin()" class="bg-red-600 hover:bg-red-700 text-white text-xs font-semibold px-4 py-2 rounded-lg transition shadow">
          Keluar Admin
        </button>
      </div>
    </div>
  </div>

  <main class="flex-grow max-w-4xl mx-auto w-full px-4 sm:px-6 lg:px-8 py-10">

    <div id="secLogin" class="max-w-md mx-auto bg-white p-8 rounded-2xl border border-slate-200 shadow-xl space-y-6">
      <div class="text-center space-y-2">
        <div class="text-4xl">🔐</div>
        <h2 class="font-resmi text-2xl font-bold text-slate-900">Login Panel Humas</h2>
        <p class="text-xs text-slate-500">Masukkan kata sandi untuk mengelola berita portal.</p>
      </div>

      <form onsubmit="prosesLogin(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">Password Admin</label>
          <input type="password" id="inputPassword" required placeholder="Masukkan password..." 
                 class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-800 text-sm">
        </div>
        <p id="loginError" class="text-xs text-red-600 hidden font-semibold">Password salah, coba lagi!</p>
        <button type="submit" class="w-full py-3 bg-blue-900 hover:bg-blue-800 text-amber-400 font-bold text-sm rounded-xl transition shadow-md">
          MASUK PANEL
        </button>
      </form>
    </div>

    <div id="secDashboard" class="hidden space-y-10">
      
      <div class="bg-white p-6 md:p-8 rounded-2xl border border-slate-200 shadow-md space-y-6">
        <div class="border-b border-slate-100 pb-4 flex items-center justify-between">
          <h2 class="font-resmi text-2xl font-bold text-slate-900 flex items-center gap-2">
            <span>📝</span> Tambah Berita Baru
          </h2>
          <span class="text-xs font-semibold bg-blue-100 text-blue-800 px-3 py-1 rounded-full">Database Firebase</span>
        </div>

        <form id="formTambahBerita" class="space-y-4">
          <div>
            <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">Judul Berita</label>
            <input type="text" id="judul" required placeholder="Contoh: UPACARA PELANTIKAN SISWA..." 
                   class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-800 text-sm">
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
              <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">Tanggal Berita</label>
              <input type="text" id="tanggal" required placeholder="Contoh: 08 AGU 2026" 
                     class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-800 text-sm">
            </div>
            <div>
              <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">URL Foto / Video (.mp4)</label>
              <input type="url" id="mediaUrl" required placeholder="https://domain.com/gambar.png atau .mp4" 
                     class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-800 text-sm">
            </div>
          </div>

          <div>
            <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">Isi Berita / Deskripsi</label>
            <textarea id="deskripsi" rows="5" required placeholder="Tuliskan detail berita selengkapnya..." 
                      class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-800 text-sm"></textarea>
          </div>

          <button type="submit" id="btnSubmit" class="w-full py-3 bg-blue-900 hover:bg-blue-800 text-amber-400 font-bold text-sm rounded-xl transition shadow-md">
            PUBLIKASIKAN BERITA
          </button>
        </form>
      </div>

      <div class="bg-white p-6 md:p-8 rounded-2xl border border-slate-200 shadow-md space-y-6">
        <h2 class="font-resmi text-xl font-bold text-slate-900 border-b border-slate-100 pb-3">
          Daftar Berita Terpublikasi
        </h2>
        <div id="listKelolaBerita" class="space-y-4">
          <p class="text-xs text-slate-500">Memuat daftar berita...</p>
        </div>
      </div>

    </div>

  </main>

  <footer class="bg-slate-900 text-slate-400 py-6 mt-auto border-t-4 border-blue-900">
    <div class="max-w-6xl mx-auto px-4 text-center">
      <p class="text-xs font-semibold text-slate-300">Copyright &copy; 2026 Komando Armada RI RBX</p>
    </div>
  </footer>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAMYa0AF2_aH8N93fR22YIa9Kg0AGjKrLI",
      authDomain: "portal-koarmada-92e19.firebaseapp.com",
      projectId: "portal-koarmada-92e19",
      storageBucket: "portal-koarmada-92e19.firebasestorage.app",
      messagingSenderId: "966060677941",
      appId: "1:966060677941:web:cd6074b5d8e2b3b9edca7c"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // KATA SANDI ADMIN DEFAULT (Bisa diganti)
    const PASSWORD_ADMIN = "koarmada2026";

    window.prosesLogin = function(e) {
      e.preventDefault();
      const pwd = document.getElementById('inputPassword').value;
      if (pwd === PASSWORD_ADMIN) {
        localStorage.setItem('isAdminLoggedIn', 'true');
        tampilkanDashboard();
      } else {
        document.getElementById('loginError').classList.remove('hidden');
      }
    };

    window.logoutAdmin = function() {
      localStorage.removeItem('isAdminLoggedIn');
      location.reload();
    };

    function tampilkanDashboard() {
      document.getElementById('secLogin').classList.add('hidden');
      document.getElementById('secDashboard').classList.remove('hidden');
      document.getElementById('btnKeluarWrapper').classList.remove('hidden');
      loadDaftarBeritaAdmin();
    }

    // Cek Sesi Login
    if (localStorage.getItem('isAdminLoggedIn') === 'true') {
      tampilkanDashboard();
    }

    // TAMBAH BERITA KE FIREBASE
    document.getElementById('formTambahBerita').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btnSubmit');
      btn.innerText = "MEMPROSES...";
      btn.disabled = true;

      try {
        await addDoc(collection(db, "berita"), {
          judul: document.getElementById('judul').value,
          tanggal: document.getElementById('tanggal').value,
          mediaUrl: document.getElementById('mediaUrl').value,
          deskripsi: document.getElementById('deskripsi').value,
          waktu: serverTimestamp()
        });

        alert("Berita berhasil dipublikasikan!");
        document.getElementById('formTambahBerita').reset();
        loadDaftarBeritaAdmin();
      } catch (err) {
        alert("Gagal menambahkan berita: " + err.message);
      } finally {
        btn.innerText = "PUBLIKASIKAN BERITA";
        btn.disabled = false;
      }
    });

    // LOAD DAFTAR BERITA UNTUK DIHAPUS
    async function loadDaftarBeritaAdmin() {
      const container = document.getElementById('listKelolaBerita');
      try {
        const q = query(collection(db, "berita"), orderBy("waktu", "desc"));
        const snapshot = await getDocs(q);

        if (snapshot.empty) {
          container.innerHTML = `<p class="text-xs text-slate-500 italic">Belum ada berita di database.</p>`;
          return;
        }

        container.innerHTML = "";
        snapshot.forEach((docSnap) => {
          const item = docSnap.data();
          const docId = docSnap.id;

          container.innerHTML += `
            <div class="p-4 bg-slate-50 rounded-xl border border-slate-200 flex flex-col md:flex-row md:items-center justify-between gap-4">
              <div>
                <span class="text-[10px] bg-amber-100 text-amber-800 font-bold px-2 py-0.5 rounded">${item.tanggal || 'TERKINI'}</span>
                <h4 class="font-bold text-sm text-slate-900 mt-1">${item.judul}</h4>
              </div>
              <button onclick="hapusBerita('${docId}')" class="bg-red-50 hover:bg-red-600 text-red-600 hover:text-white border border-red-200 text-xs font-bold px-4 py-2 rounded-lg transition text-center">
                Hapus
              </button>
            </div>
          `;
        });
      } catch (err) {
        container.innerHTML = `<p class="text-xs text-red-500">Gagal memuat berita: ${err.message}</p>`;
      }
    }

    // HAPUS BERITA
    window.hapusBerita = async function(docId) {
      if (confirm("Yakin ingin menghapus berita ini?")) {
        try {
          await deleteDoc(doc(db, "berita", docId));
          alert("Berita berhasil dihapus!");
          loadDaftarBeritaAdmin();
        } catch (err) {
          alert("Gagal menghapus: " + err.message);
        }
      }
    };
  </script>
</body>
</html>
