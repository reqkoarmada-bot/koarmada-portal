<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Admin Berita - KOARMADA RI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between">

  <div id="modalLogin" class="fixed inset-0 bg-slate-950/90 backdrop-blur-md flex items-center justify-center p-4 z-50">
    <div class="bg-slate-800 border border-slate-700 p-6 rounded-2xl max-w-sm w-full shadow-2xl">
      <div class="text-center mb-6">
        <div class="w-12 h-12 bg-amber-500/10 text-amber-400 rounded-full flex items-center justify-center mx-auto mb-3 text-xl border border-amber-500/20">🔒</div>
        <h3 class="text-lg font-bold text-white">Akses Admin Berita</h3>
        <p class="text-xs text-slate-400 mt-1">Masukkan password khusus admin berita</p>
      </div>

      <form id="formLoginAdmin" onsubmit="verifikasiPassword(event)" class="space-y-4">
        <div>
          <input type="password" id="inputPassword" placeholder="Masukkan Password..." required
            class="w-full px-4 py-2.5 bg-slate-900 border border-slate-700 rounded-lg text-sm text-white focus:outline-none focus:border-amber-400">
        </div>
        <p id="pesanEror" class="text-xs text-red-400 hidden font-medium text-center"></p>
        <button type="submit" id="btnSubmitLogin"
          class="w-full py-2.5 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold rounded-lg text-sm transition">
          Masuk Panel
        </button>
      </form>
    </div>
  </div>

  <div id="kontenAdmin" class="hidden">
    
    <header class="bg-slate-800 border-b border-slate-700 py-4 px-6 flex justify-between items-center">
      <div class="flex items-center gap-3">
        <span class="text-xl">⚓</span>
        <h1 class="font-bold text-lg text-amber-400">Panel Admin Publikasi Berita</h1>
      </div>
      <a href="berita.html" class="text-xs bg-slate-700 hover:bg-slate-600 px-3 py-1.5 rounded-lg text-slate-200 transition">
        ← Keluar & Cek Web
      </a>
    </header>

    <main class="max-w-4xl mx-auto p-6 space-y-8">
      <div class="bg-slate-800 border border-slate-700 rounded-2xl p-6 shadow-lg">
        <h2 class="text-base font-bold text-white mb-4 border-b border-slate-700 pb-3 flex items-center gap-2">
          <span>📝</span> Tambah Berita Baru
        </h2>

        <form id="formTambahBerita" class="space-y-4">
          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1">Judul Berita</label>
            <input type="text" id="judul" required placeholder="Contoh: Latihan Armada Jaya XXX..."
              class="w-full px-4 py-2 bg-slate-900 border border-slate-700 rounded-lg text-sm text-white focus:outline-none focus:border-amber-400">
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1">Upload Foto Berita (Langsung dari Galeri HP)</label>
            <input type="file" id="fileGambar" accept="image/*"
              class="w-full text-xs text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-amber-500 file:text-slate-950 hover:file:bg-amber-400 cursor-pointer bg-slate-900 border border-slate-700 rounded-lg p-1">
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-400 mb-1">Atau Gunakan Link URL Media (Opsional)</label>
            <input type="url" id="mediaUrl" placeholder="https://... (Kosongkan jika sudah upload foto di atas)"
              class="w-full px-4 py-2 bg-slate-900 border border-slate-700 rounded-lg text-xs text-white focus:outline-none focus:border-amber-400">
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1">Deskripsi Berita</label>
            <textarea id="deskripsi" rows="4" required placeholder="Tulis rincian berita di sini..."
              class="w-full px-4 py-2 bg-slate-900 border border-slate-700 rounded-lg text-sm text-white focus:outline-none focus:border-amber-400"></textarea>
          </div>

          <button type="submit" id="btnPublish"
            class="w-full py-3 bg-blue-600 hover:bg-blue-500 font-bold rounded-lg text-sm text-white transition shadow-md">
            🚀 Publikasikan Berita
          </button>
        </form>
      </div>

      <div class="bg-slate-800 border border-slate-700 rounded-2xl p-6 shadow-lg">
        <h2 class="text-base font-bold text-white mb-4 border-b border-slate-700 pb-3 flex items-center gap-2">
          <span>📰</span> Daftar Berita Terbit
        </h2>

        <div id="listBeritaAdmin" class="space-y-4">
          <p class="text-xs text-slate-400 text-center py-4">Memuat daftar berita...</p>
        </div>
      </div>
    </main>

  </div>

  <footer class="text-center py-4 text-xs text-slate-500 border-t border-slate-800">
    Humas Komando Armada RI &copy; 2026
  </footer>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
    import { 
      getFirestore, 
      collection, 
      addDoc, 
      getDocs, 
      doc, 
      deleteDoc, 
      query, 
      orderBy, 
      serverTimestamp 
    } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAMYa0AF2_aH8N93fR22YIa9Kg0AGjKrLI",
      authDomain: "portal-koarmada-92e19.firebaseapp.com",
      projectId: "portal-koarmada-92e19",
      storageBucket: "portal-koarmada-92e19.firebasestorage.app",
      messagingSenderId: "966060677941",
      appId: "1:966060677941:web:cd6074b5d8e2b3b9edca7c"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // LOGIN API
    window.verifikasiPassword = async function(e) {
      e.preventDefault();
      const pwd = document.getElementById('inputPassword').value;
      const msgErr = document.getElementById('pesanEror');
      const btn = document.getElementById('btnSubmitLogin');

      msgErr.classList.add('hidden');
      btn.innerText = "Memeriksa...";
      btn.disabled = true;

      try {
        const response = await fetch('/api/login-berita', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: pwd })
        });

        const result = await response.json();

        if (response.ok && result.success) {
          document.getElementById('modalLogin').classList.add('hidden');
          document.getElementById('kontenAdmin').classList.remove('hidden');
          loadDaftarBeritaAdmin();
        } else {
          msgErr.innerText = result.message || "Password Salah!";
          msgErr.classList.remove('hidden');
        }
      } catch (err) {
        msgErr.innerText = "Gagal menghubungkan ke API server.";
        msgErr.classList.remove('hidden');
      } finally {
        btn.innerText = "Masuk Panel";
        btn.disabled = false;
      }
    };

    // FUNGSI KOMPRES FOTO DARI HP KE BASE64
    function kompresGambar(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (e) => {
          const img = new Image();
          img.src = e.target.result;
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let width = img.width;
            let height = img.height;
            const maxDim = 1000;

            if (width > maxDim || height > maxDim) {
              if (width > height) {
                height = Math.round((height * maxDim) / width);
                width = maxDim;
              } else {
                width = Math.round((width * maxDim) / height);
                height = maxDim;
              }
            }

            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            resolve(canvas.toDataURL('image/jpeg', 0.7)); // Kompres ke JPEG 70% kualitas
          };
        };
        reader.onerror = err => reject(err);
      });
    }

    // TAMBAH BERITA
    document.getElementById('formTambahBerita').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btnPublish');
      btn.innerText = "Memproses Gambar & Upload...";
      btn.disabled = true;

      const judul = document.getElementById('judul').value;
      const fileInput = document.getElementById('fileGambar');
      let mediaUrl = document.getElementById('mediaUrl').value;
      const deskripsi = document.getElementById('deskripsi').value;

      try {
        // Jika user memilih file dari galeri HP
        if (fileInput.files && fileInput.files[0]) {
          mediaUrl = await kompresGambar(fileInput.files[0]);
        }

        if (!mediaUrl) {
          alert("Pilih foto dari Galeri HP atau isi Link URL Gambar terlebih dahulu!");
          btn.innerText = "🚀 Publikasikan Berita";
          btn.disabled = false;
          return;
        }

        const now = new Date();
        const opsiTgl = { day: '2-digit', month: 'short', year: 'numeric' };
        const tanggalFormat = now.toLocaleDateString('id-ID', opsiTgl).toUpperCase();

        await addDoc(collection(db, "berita"), {
          judul: judul,
          mediaUrl: mediaUrl,
          deskripsi: deskripsi,
          tanggal: tanggalFormat,
          waktu: serverTimestamp()
        });

        alert("Berita berhasil dipublikasikan!");
        document.getElementById('formTambahBerita').reset();
        loadDaftarBeritaAdmin();
      } catch (err) {
        alert("Gagal menyimpan berita: " + err.message);
      } finally {
        btn.innerText = "🚀 Publikasikan Berita";
        btn.disabled = false;
      }
    });

    // LOAD DAFTAR BERITA
    async function loadDaftarBeritaAdmin() {
      const container = document.getElementById('listBeritaAdmin');
      container.innerHTML = `<p class="text-xs text-slate-400 text-center py-4">Memuat daftar berita...</p>`;

      try {
        const q = query(collection(db, "berita"), orderBy("waktu", "desc"));
        const snapshot = await getDocs(q);

        if (snapshot.empty) {
          container.innerHTML = `<p class="text-xs text-slate-400 text-center py-4">Belum ada berita yang dipublikasikan.</p>`;
          return;
        }

        let html = "";
        snapshot.forEach((docSnap) => {
          const item = docSnap.data();
          const docId = docSnap.id;

          html += `
            <div class="bg-slate-900 border border-slate-700/80 rounded-xl p-4 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
              <div class="flex-1">
                <span class="text-[10px] font-bold text-amber-400 bg-amber-400/10 px-2 py-0.5 rounded border border-amber-400/20">
                  ${item.tanggal || 'TERKINI'}
                </span>
                <h3 class="font-bold text-white text-sm mt-1">${item.judul}</h3>
                <p class="text-xs text-slate-400 line-clamp-1 mt-1">${item.deskripsi}</p>
              </div>
              <button onclick="hapusBerita('${docId}')" 
                class="w-full md:w-auto px-3 py-1.5 bg-red-600/20 hover:bg-red-600 text-red-400 hover:text-white border border-red-500/30 rounded-lg text-xs font-semibold transition flex items-center justify-center gap-1.5">
                <span>🗑️</span> Hapus
              </button>
            </div>
          `;
        });

        container.innerHTML = html;
      } catch (err) {
        container.innerHTML = `<p class="text-xs text-red-400 text-center py-4">Gagal memuat berita: ${err.message}</p>`;
      }
    }

    // HAPUS BERITA
    window.hapusBerita = async function(id) {
      if (!confirm("Apakah Anda yakin ingin menghapus berita ini?")) return;

      try {
        await deleteDoc(doc(db, "berita", id));
        alert("Berita berhasil dihapus!");
        loadDaftarBeritaAdmin();
      } catch (err) {
        alert("Gagal menghapus berita: " + err.message);
      }
    };
  </script>
</body>
</html>
