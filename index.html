<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Resmi KOARMADA RI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between">

  <header class="bg-slate-800 border-b border-slate-700 py-4 px-6 flex justify-between items-center">
    <div class="flex items-center gap-3">
      <span class="text-2xl">⚓</span>
      <div>
        <h1 class="font-bold text-base text-amber-400">KOMANDO ARMADA RI</h1>
        <p class="text-[10px] text-slate-400">TNI Angkatan Laut</p>
      </div>
    </div>
    <div class="flex items-center gap-2">
      <a href="berita.html" class="text-xs bg-slate-700 hover:bg-slate-600 text-slate-200 font-medium px-3 py-1.5 rounded-lg transition">
        Semua Berita
      </a>
      <a href="admin-berita.html" class="text-xs bg-amber-500/10 text-amber-400 border border-amber-500/30 hover:bg-amber-500 hover:text-slate-950 font-semibold px-3 py-1.5 rounded-lg transition">
        Panel Admin
      </a>
    </div>
  </header>

  <main class="max-w-6xl mx-auto p-6 w-full flex-1 space-y-8">
    <div class="border-b border-slate-700 pb-3">
      <h2 class="text-2xl font-bold text-white flex items-center gap-2">
        <span>📰</span> Berita Terkini
      </h2>
    </div>

    <div id="gridBeritaIndex" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      <p class="text-xs text-slate-400 col-span-full text-center py-12">Memuat berita terbaru...</p>
    </div>
  </main>

  <footer class="text-center py-4 text-xs text-slate-500 border-t border-slate-800">
    Humas Komando Armada RI &copy; 2026
  </footer>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
    import { getFirestore, collection, getDocs, query, orderBy, limit } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAMYa0AF2_aH8N93fR22YIa9Kg0AGjKrLI",
      authDomain: "portal-koarmada-92e19.firebaseapp.com",
      projectId: "portal-koarmada-92e19",
      storageBucket: "portal-koarmada-92e19.firebasestorage.app",
      messagingSenderId: "966060677941",
      appId: "1:966060677941:web:cd6074b5d8e2b3b9edca7c"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    async function loadBerita() {
      const grid = document.getElementById('gridBeritaIndex');
      try {
        const q = query(collection(db, "berita"), orderBy("waktu", "desc"), limit(6));
        const snapshot = await getDocs(q);

        if (snapshot.empty) {
          grid.innerHTML = `<p class="text-xs text-slate-400 col-span-full text-center py-12">Belum ada berita dipublikasikan.</p>`;
          return;
        }

        grid.innerHTML = "";
        snapshot.forEach((docSnap) => {
          const item = docSnap.data();
          grid.innerHTML += `
            <div class="bg-slate-800 border border-slate-700 rounded-2xl overflow-hidden shadow-lg flex flex-col">
              <div class="h-48 bg-slate-950 overflow-hidden">
                <img src="${item.mediaUrl}" alt="Media Berita" class="w-full h-full object-cover">
              </div>
              <div class="p-5 flex-1 flex flex-col justify-between space-y-3">
                <div>
                  <span class="text-[10px] font-bold text-amber-400 bg-amber-400/10 px-2 py-0.5 rounded border border-amber-400/20">
                    ${item.tanggal || 'TERKINI'}
                  </span>
                  <h3 class="font-bold text-white text-base mt-2 leading-snug">
                    ${item.judul}
                  </h3>
                  <p class="text-xs text-slate-400 mt-2 leading-relaxed">
                    ${item.deskripsi}
                  </p>
                </div>
              </div>
            </div>
          `;
        });
      } catch (err) {
        grid.innerHTML = `<p class="text-xs text-red-400 col-span-full text-center py-12">Gagal memuat berita: ${err.message}</p>`;
      }
    }

    loadBerita();
  </script>
</body>
</html>
